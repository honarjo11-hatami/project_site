<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات خبر | هنرستان حاتمی</title>
  <meta name="description" content="مشاهده جزئیات خبر هنرستان حاتمی">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header-slot"></div>

  <section class="page-banner">
    <h1 id="pageTitle">خبر</h1>
    <div class="breadcrumb"><a href="index.html">صفحه اصلی</a> <span>/</span> <a href="news.html">اخبار</a> <span>/</span> <span id="pageCrumb">جزئیات</span></div>
  </section>

  <section class="section">
    <div class="container" style="max-width:800px;">
      <div id="newsContent"></div>
    </div>
  </section>

  <div id="footer-slot"></div>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initComponents('news');
      const id = parseInt(getParam('id')) || 1;
      const n = NEWS.find(x => x.id === id) || NEWS[0];

      document.title = n.title + ' | هنرستان حاتمی';
      document.getElementById('pageTitle').textContent = n.category;
      document.getElementById('pageCrumb').textContent = n.title;

      document.getElementById('newsContent').innerHTML = `
        <span class="news-card-cat" style="margin-bottom:16px;">${n.category}</span>
        <h1 style="font-size:28px;font-weight:900;color:var(--text-heading);margin:12px 0 16px;line-height:1.4;">${n.title}</h1>
        <div class="news-detail-meta">
          <span>${ICONS.calendar} ${n.date}</span>
          <span>${ICONS.user} هنرستان حاتمی</span>
        </div>
        <div class="news-detail-hero">
          <img src="${n.image}" alt="${n.title}">
        </div>
        <div class="news-detail-content">
          <p>${n.summary}</p>
          <p>${n.content}</p>
          <p>برای کسب اطلاعات بیشتر می‌توانید با دبیرخانه هنرستان تماس بگیرید یا از صفحه <a href="contact.html" style="color:var(--gold);font-weight:600;">ارتباط با ما</a> اقدام نمایید.</p>
        </div>
        <div class="form-note" style="margin-top:24px;">
          ${ICONS.clock} این خبر به‌صورت نمونه نمایش داده شده است. اخبار واقعی توسط مدیر سایت منتشر خواهند شد.
        </div>
        <div style="margin-top:32px;text-align:center;">
          <a href="news.html" class="btn btn-outline">${ICONS.arrow} بازگشت به فهرست اخبار</a>
        </div>
      `;
    });
  </script>
</body>
</html>
